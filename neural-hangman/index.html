<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanged Man | Lantieridev Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --error-color: #f43f5e;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 2.5rem;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, var(--border-color), transparent);
            border-radius: 2.5rem;
            z-index: -1;
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .subtitle {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: block;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            width: 100%;
        }

        #word-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            letter-spacing: 0.15em;
            color: var(--accent-color);
            text-shadow: 0 0 20px var(--accent-glow);
            min-height: 4rem;
            display: block;
            text-align: center;
            transition: all 0.3s ease;
            white-space: nowrap;
            width: 100%;
        }

        .attempts-display {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .attempts-pip {
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .attempts-pip.used {
            background: transparent;
            border: 1px solid var(--border-color);
            box-shadow: none;
        }

        .guessed-letters-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            min-height: 1.5rem;
            margin-top: 0.5rem;
            width: 100%;
        }

        .guessed-letter {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        label {
            font-size: 0.6rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
        }

        .input-wrapper {
            display: flex;
            gap: 0.75rem;
            width: 100%;
        }

        input {
            width: 4.5rem;
            height: 4.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-color);
            border-radius: 1.25rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px var(--accent-glow);
            transform: scale(1.05);
        }

        button {
            flex: 1;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 1.25rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 1.5rem;
            text-align: center;
            min-height: 5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #message {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .win { color: var(--success-color) !important; font-weight: 700; }
        .loss { color: var(--error-color) !important; font-weight: 700; }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 2rem;
                border-radius: 1.5rem;
            }
            #word-display {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span class="subtitle">Neural Challenge</span>
            <h1>Hanged Man</h1>
            <div id="stats" style="margin-top: 1rem; font-size: 0.7rem; color: var(--text-secondary);">
                Wins: <span id="win-count">0</span>
            </div>
        </header>

        <main class="game-area">
            <div style="text-align: center; width: 100%;">
                <span id="category-display" style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.3em; color: var(--accent-color); opacity: 0.8;">Technology</span>
                <div id="word-display">_ _ _ _</div>
                <div id="attempts-display" class="attempts-display" role="meter" aria-label="Attempts remaining" aria-valuemin="0" aria-valuemax="6" aria-valuenow="6"></div>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label for="letter-input">Enter a letter</label>
                    <div class="input-wrapper">
                        <input type="text" id="letter-input" maxlength="1" placeholder="?" autocomplete="off">
                        <button id="try-button">Attempt</button>
                    </div>
                </div>

                <div class="status-box">
                    <p id="message">Welcome. Guess the word to survive.</p>
                </div>
                
                <button id="reset-button" style="display: none; background: transparent; border: 1px solid var(--border-color); margin-top: -0.5rem;">New Game</button>
                
                <div id="guessed-letters-section" style="margin-top: 1rem; text-align: center; display: none;">
                    <label style="font-size: 0.55rem; opacity: 0.5;">GUESSED LETTERS</label>
                    <div id="guessed-letters" class="guessed-letters-container"></div>
                </div>
            </div>
        </main>

        <footer>
            Lantieridev Portfolio • 2026
        </footer>
    </div>

    <script src="index.js"></script>
</body>
</html>
